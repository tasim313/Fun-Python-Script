<!DOCTYPE html>
<html>
<head>
    <title>Lab Workflow Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Laboratory Workflow Analysis Tool</h1>
        
        <div class="card">
            <div class="card-header">
                Upload Data
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Select CSV or Excel file:</label>
                        <input class="form-control" type="file" name="file" id="file" accept=".csv,.xlsx" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload and Analyze</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
