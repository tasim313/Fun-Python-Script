<!DOCTYPE html>
<html>
<head>
    <title>Product Market Analyzer</title>
</head>
<body>
    <h2>Upload a Product Image and Name</h2>
    <form action="/" method="post" enctype="multipart/form-data">
        <input type="text" name="product_name" placeholder="Enter product name" required><br><br>
        <input type="file" name="product_image" accept="image/*" required><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
