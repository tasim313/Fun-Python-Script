version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: spreadsheet
      POSTGRES_USER: spreadsheet
      POSTGRES_PASSWORD: spreadsheet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_connections=200

  web:
    build: .
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: spreadsheet
      POSTGRES_USER: spreadsheet
      POSTGRES_PASSWORD: spreadsheet
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"

volumes:
  postgres_data:
